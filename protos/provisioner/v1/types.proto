syntax = "proto3";

package provisioner.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Spec is what the operator asks for. Provider-agnostic. Everything in
// the spec is decided before any provider call happens.
//
// Locked by docs/design/0001-provisioner.md. Read that for the rationale
// behind every field -- especially id (mandatory and tenant-globally
// unique) and requirements (constraints-first, with class as shorthand
// and sku as escape hatch).
message Spec {
  // Operator-supplied identifier. Required. Tenant-globally unique
  // across all providers. The service rejects ids starting with the
  // reserved "iplane-" prefix.
  string id = 1;

  // Adapter that will fulfil the spec ("runpod", "local").
  string provider = 2;

  // Provider-specific region identifier. Required.
  string region = 3;

  // What the operator needs to run their workload. Numeric constraints
  // are the canonical axis; class is shorthand; sku is the escape hatch.
  ResourceRequirements requirements = 4;

  // Docker-capable base image ref the provider should boot. Phase 2's
  // deploy primitive docker-runs the engine container on top. Empty
  // means "provider default."
  string base_image = 5;

  // Operator-supplied labels (cost attribution, owner, cluster
  // membership). The adapter merges them with the iplane-id and
  // iplane-operator tags it stamps automatically.
  map<string, string> tags = 6;
}

// FabricScope is how far an instance's fast GPU interconnect reaches.
//
// Deliberately vendor-neutral. NVLink, AMD xGMI and Intel Xe Link are all
// INTRA_NODE; InfiniBand, RoCE and AWS EFA are all INTER_NODE. The control
// plane asks for a scope and a bandwidth; which technology delivers it is the
// adapter's business, and no control-plane logic branches on the vendor name
// (see Hardware.fabric_technology, which carries it for humans only).
//
// An earlier draft (docs/design/0003-kv-domain.md) modelled this as
// `enum Interconnect { NONE, RDMA, NVLINK }`. That conflated two axes:
// NVLink is one vendor's intra-node link, RDMA is a cross-node access
// semantic. docs/design/0006 supersedes it with this enum.
//
// NOTE: the two scopes are NOT ordered. INTER_NODE does not imply
// INTRA_NODE -- a PCIe-only box behind InfiniBand has a fast cross-node
// fabric and no fast link between its own cards. A requirement that needs
// both at once therefore needs two fields, not one enum value. We carry one
// axis while the only consumer wanting both (a cross-node pool, issue 212)
// is descoped; add the second axis when that lands.
enum FabricScope {
  FABRIC_SCOPE_UNSPECIFIED = 0;
  // No fast fabric required. PCIe / TCP between cards is fine. This is the
  // Ch 6-9 default: independent replicas that never exchange tensors.
  FABRIC_SCOPE_NONE = 1;
  // Cards within one node share a fast link. What a tensor-parallel group
  // needs, since every card holds a slice of every layer.
  FABRIC_SCOPE_INTRA_NODE = 2;
  // Nodes share a fast link. What cross-node pipeline parallelism needs.
  FABRIC_SCOPE_INTER_NODE = 3;
}

// FabricSource records how much to trust a FabricScope reading, because no
// provider reports intra-node topology as a queryable spec field and the
// sourcing differs per adapter (see docs/design/0006 Part 2).
//
// The distinction is load-bearing, not bookkeeping: UNKNOWN must never
// satisfy a fabric requirement. Probing live on 2026-08-09, a quarter of
// Vast's SXM machines reported zero NVLink bandwidth on boards that are
// physically always NVLinked, so "no reading" and "measured zero" are
// indistinguishable in the payload and both have to fail closed.
enum FabricSource {
  FABRIC_SOURCE_UNSPECIFIED = 0;
  // Curated catalog keyed on SKU name and form factor. Trustworthy about the
  // card, silent about what the host actually wired up.
  FABRIC_SOURCE_DECLARED = 1;
  // The provider reported a reading (Vast's bw_nvlink). Outranks DECLARED
  // when they disagree: a bridged card named "PCIe" is a real machine a
  // name-only catalog would wrongly exclude.
  FABRIC_SOURCE_MEASURED = 2;
  // No catalog entry and no usable reading. Fails every fabric requirement.
  FABRIC_SOURCE_UNKNOWN = 3;
}

// ResourceRequirements is what the operator needs to run their workload.
// Three layers, from most-honest to most-convenient:
//
//   1. Numeric constraints (min_vram_gb, min_disk_gb, min_ram_gb) -- the
//      canonical axis. What actually matters when deploying a model
//      (does {weights + KV cache + activations + overhead} fit in VRAM?).
//      Provider-agnostic by construction.
//
//   2. Class shorthand (class = "small" | "medium" | "large" | "xlarge")
//      -- syntactic sugar that the service expands into typical
//      constraint defaults at validation time. Operators who do not
//      want to spell out every constraint use this; the chapter's
//      act-3 demo uses this. Explicit constraints alongside class
//      refine the defaults (class sets floors, constraints can raise).
//
//   3. SKU override (sku) -- the escape hatch when constraints and
//      class do not capture what the operator needs (specific NVLink
//      topology, particular generation, exact provider SKU). Skips
//      the resolver entirely; passed straight to the provider.
//
// Per-provider SKU resolvers (b in the (a) constraints / (b) resolver /
// (c) executor model) consume the constraints and emit an ordered list
// of matching SKU identifiers, cheapest first, for the provider's
// scheduler.
message ResourceRequirements {
  // Constraints below describe ONE instance (one provider machine).
  // gpu_count > 1 means N GPUs co-located on that single machine,
  // used together (typical for tensor / pipeline parallelism). Fleets
  // of N machines each with M GPUs are not expressed here -- they
  // come from a higher layer composing N Spawn calls (v0.3's
  // ClusterManager, see docs/design/0001-provisioner.md
  // "Per-instance, not per-cluster").
  //
  // The "scope" of each constraint matches how the underlying resource
  // physically exists on the machine:
  //
  //   - VRAM is PER-GPU (each card has dedicated memory).
  //   - System RAM is PER-INSTANCE (one DDR pool, shared by CPU + GPUs).
  //   - Disk is PER-INSTANCE (one volume).
  //
  // So min_vram_gb=80, gpu_count=2 means "2 GPUs each with at least
  // 80 GB VRAM" (160 GB VRAM total on the machine). min_ram_gb=512,
  // gpu_count=4 means "one instance with at least 512 GB total system
  // RAM across all 4 GPUs."
  //
  // Provider adapters convert at the wire boundary -- RunPod's
  // minRAMPerGPU field is per-GPU, so the adapter divides our total
  // min_ram_gb by gpu_count before sending the request.

  // Minimum VRAM in GB, per GPU. Required (or set via class shorthand).
  int32 min_vram_gb = 1;
  // Minimum container disk in GB, per instance. 0 = use provider default.
  int32 min_disk_gb = 2;
  // Minimum system RAM in GB, per instance. 0 = use provider default.
  int32 min_ram_gb = 3;
  // GPU count on the instance. 0 means 1.
  int32 gpu_count = 4;

  // Class shorthand. Expanded server-side into constraint defaults.
  string class = 5;

  // Exact-SKU escape hatch. When set, skips constraint resolution and
  // is passed verbatim to the provider. Mutually exclusive with class
  // (and constraints are ignored -- the SKU is the answer).
  string sku = 6;

  // Fabric the instance's GPUs must be wired for. Constrains SKU selection
  // the same way min_vram_gb does: the resolver drops candidates whose
  // fabric is not known to satisfy this. UNSPECIFIED (the Ch 6-9 default)
  // means the operator does not care.
  //
  // A candidate whose fabric is FABRIC_SOURCE_UNKNOWN never satisfies a set
  // fabric_scope. That is the point of the field -- guessing costs a rented
  // pool before it reports an answer. `sku` remains the override for
  // operators who know better than the catalog.
  FabricScope fabric_scope = 7;

  // Minimum fabric bandwidth, GIGABITS per second, aggregate per GPU.
  // 0 = any bandwidth satisfying fabric_scope.
  //
  // Gigabits, not gigabytes, and the 8x is a real trap: NVLink is universally
  // quoted in GB/s (an A100's 300 GB/s) while InfiniBand and EFA are quoted in
  // Gbps (RunPod's 3200 Gbps clusters). Adapters convert at the wire boundary,
  // matching the same single-unit rule Hardware uses for memory, so that A100
  // arrives here as 2400.
  int32 min_fabric_gbps = 8;

  // Whether the operator will accept capacity the provider can take back.
  //
  // Named for the property rather than for a vendor's noun, the same reason
  // fabric_scope is not called needs_nvlink. Vendors sell this as spot,
  // interruptible, preemptible and community, and picking one of those words
  // would bake one marketplace's vocabulary into a cross-provider contract.
  // What every version has in common is the only thing the control plane
  // cares about: the hardware is cheaper and it can be reclaimed.
  //
  // This constrains selection rather than decorating a create call. A
  // provider with no reclaimable tier must fail the request rather than
  // quietly rent on-demand capacity: an operator who asked for reclaimable
  // asked for a discount, and silently billing them full price is the exact
  // shape of failure the fabric rules exist to prevent (see #283's
  // neighbourhood, and the FabricSource doctrine).
  ReclaimPolicy reclaim_policy = 9;
}

// ReclaimPolicy says whether capacity the provider can take back is acceptable.
//
// Three states rather than a bool, for the reason absence keeps needing to be
// representable: UNSPECIFIED is the Ch 6-10 default and must stay free, and it
// is not the same as an operator deliberately refusing reclaimable capacity.
enum ReclaimPolicy {
  // Operator expressed no preference. Providers offer whatever they normally
  // would, which in practice is the on-demand tier.
  RECLAIM_POLICY_UNSPECIFIED = 0;

  // On-demand only. The rental must not be reclaimable, which matters for a
  // run that cannot survive being interrupted partway.
  RECLAIM_POLICY_NEVER = 1;

  // Reclaimable capacity is wanted, for the discount. A provider that cannot
  // offer it drops out of the candidate set rather than substituting the
  // dearer tier.
  RECLAIM_POLICY_PREFERRED = 2;
}

// Hardware is the cross-provider physical-characteristics base for
// an Instance. Every adapter populates what its provider exposes;
// fields the provider doesn't surface stay 0 (or "" for strings).
//
// **All memory fields are MB.** Units are uniform on the iplane
// side -- adapters convert at the wire boundary so callers never
// see provider-specific GB/GiB/MiB mismatches. The single-unit
// convention also kills round-tripping bugs (the 24564 MB -> 23
// GB int-truncation that bit Vast in PR for #150).
//
// Fields will graduate from `Instance.metadata` (the provider-
// specific escape hatch) into Hardware as cross-provider patterns
// become clear. The initial set is the lowest-common-denominator
// every cloud surfaces: GPU shape, vCPU count, host RAM, host disk.
message Hardware {
  // GPU details -- provider-native SKU id, count, per-GPU VRAM.
  // gpu_sku is the provider's literal identifier (gpu_1x_a10,
  // RTX 4090) so it round-trips back to the provider unchanged.
  // gpu_vram_mb is per-GPU; total VRAM is gpu_vram_mb * gpu_count.
  string gpu_sku = 1;
  int32 gpu_count = 2;
  int32 gpu_vram_mb = 3;

  // Host CPU -- virtual CPUs the operator's container sees and
  // the model string for diagnostic output. Optional; left zero
  // when the provider doesn't expose vCPU info on the rented
  // instance record.
  int32 vcpus = 10;
  string cpu_model = 11;

  // Host RAM (system memory available to the container). MB.
  int32 cpu_ram_mb = 12;

  // Host disk allocation for this rental. MB. Lambda exposes this
  // as `instance_type.specs.storage_gib`; Vast as the offer's
  // `disk_space` (GB); RunPod as the pod's `containerDiskInGb`.
  // All converted to MB at the adapter boundary.
  int32 disk_mb = 20;

  // GPU interconnect -- what this instance's fabric turned out to be, as
  // opposed to ResourceRequirements.fabric_scope, which is what was asked
  // for. Populated by each adapter from whatever its provider exposes; see
  // docs/design/0006 Part 2 for the per-provider sourcing.
  //
  // fabric_source is not decoration. Read fabric_scope WITHOUT it and an
  // unknown fabric reads as a definite NONE, which is the exact mistake the
  // pair exists to prevent.
  FabricScope fabric_scope = 30;
  FabricSource fabric_source = 31;

  // Aggregate per-GPU fabric bandwidth in GIGABITS per second, 0 when
  // unknown. Same unit (and same 8x trap) as
  // ResourceRequirements.min_fabric_gbps.
  int32 fabric_gbps = 32;

  // Vendor technology behind fabric_scope: "nvlink", "nvswitch", "xgmi",
  // "infiniband", "roce", "efa". DIAGNOSTIC ONLY -- for `iplane instance
  // describe` and debugging.
  //
  // Nothing in the control plane may branch on this string. That rule is what
  // keeps the vendor-neutral seam vendor-neutral; the moment a resolver reads
  // it, this has quietly become the vendor enum 0006 removed. Policy reads
  // fabric_scope and fabric_gbps.
  string fabric_technology = 33;
}

// SshTarget is the reachability tuple returned for instances that expose
// SSH (every provider in v0.1 except local). Phase 2's deploy primitive
// uses it to docker-run the engine container.
message SshTarget {
  string host = 1;
  int32 port = 2;
  string user = 3;
}

// InstanceState is the lifecycle phase of a provisioned instance, as
// iplane sees it. Five values, not three -- the two *ing states
// (PENDING, TERMINATING) exist so partial-failure recovery can
// distinguish "asked but do not know" from "tried and failed" without
// over-charging or leaking.
enum InstanceState {
  INSTANCE_STATE_UNSPECIFIED = 0;
  // Record written locally, Spawn call has not returned.
  INSTANCE_STATE_PENDING = 1;
  // Spawn returned success, instance reachable, billing started.
  INSTANCE_STATE_ACTIVE = 2;
  // Terminate requested, provider call has not returned.
  INSTANCE_STATE_TERMINATING = 3;
  // Provider confirms gone (or returned not-found).
  INSTANCE_STATE_TERMINATED = 4;
  // Provider returned an error; resolution requires operator action.
  INSTANCE_STATE_FAILED = 5;
}

// Instance is what the provider returned, plus iplane-side bookkeeping.
// The spec field is a snapshot of what was asked for so reconcile can
// detect drift and errata cherry-picks that change the class -> SKU
// table can still answer "what did class:large mean on the day this
// was created."
//
// Instances are immutable from iplane's perspective. Resize, change
// image, change region -- all destroy-and-recreate.
message Instance {
  // Mirror of spec.id. Iplane-side canonical identifier.
  string id = 1;

  // Provider's internal handle (RunPod pod id, AWS instance-id, a
  // process identifier for local). Filled by Spawn; empty while
  // state is PENDING or FAILED-pre-spawn.
  string provider_id = 2;

  // Which adapter owns this instance.
  string provider = 3;

  // Spec snapshot from the time of Spawn.
  Spec spec = 4;

  // Region as actually scheduled by the provider (may differ from
  // spec.region if the provider auto-selects a sub-zone).
  string region = 5;

  // Hardware as actually scheduled (concrete SKU + cross-provider
  // CPU/RAM/disk base). Replaces the v0.1 GpuInfo field which was
  // deleted pre-publication (no `reserved` marker per the no-
  // reserved-fields-pre-publication memory).
  Hardware hardware = 6;

  // What the operator is being billed at the moment of Spawn. Loaded
  // from providers.yaml then confirmed against the provider's response
  // where available.
  double hourly_rate_usd = 7;

  InstanceState state = 8;

  // When the local record was first written (state=PENDING).
  google.protobuf.Timestamp created_at = 9;

  // When Spawn returned success and state moved to ACTIVE.
  google.protobuf.Timestamp activated_at = 10;

  // When state moved to TERMINATED.
  google.protobuf.Timestamp terminated_at = 11;

  // Empty until state==ACTIVE. Local instances leave this empty
  // permanently (no remote shell on the laptop).
  SshTarget ssh = 12;

  // The wrapped provider-error message when state is FAILED. Surfaced
  // to the operator on the next list.
  string failure_reason = 13;

  // Provider-specific extension data, opaque to iplane core. Raw JSON
  // bytes so a v0.1 reader can deserialize state written by a future
  // version without losing or rejecting unknown fields -- the
  // forward-compatibility property the state file owes any reader
  // pinned to ch06-final.
  bytes provider_data = 14;

  // Provider-specific raw data the adapter wants to preserve outside
  // the typed `Hardware` base. Keys follow the convention
  // "<provider>.<field>" (e.g. "vast.reliability2",
  // "lambda.region_description", "runpod.machine_id") so cross-
  // provider readers can branch on the prefix.
  //
  // google.protobuf.Value preserves type fidelity (number, string,
  // bool, null, struct, list) so downstream code reads
  // `meta["vast.reliability2"].GetNumberValue()` and
  // `meta["vast.verification"].GetStringValue()` without per-key
  // string parsing. JSON serialization is transparent --
  // `iplane instance describe`'s output preserves the original
  // type.
  //
  // Useful for: leak detection (vast.machine_id, runpod.machine_id),
  // routing-policy hints (vast.verification, vast.reliability2),
  // Lambda-side capability flags (lambda.actions_migrate), and any
  // field the chapter doesn't surface yet but might want later.
  // Fields with cross-provider patterns graduate into `Hardware`;
  // metadata is the staging ground.
  map<string, google.protobuf.Value> metadata = 15;
}

// InstanceRef is the lighter-weight record returned by the underlying
// provider List operation. Carries the minimum needed to reconcile
// against local state. Callers that need the full Instance call
// Describe(provider_id).
message InstanceRef {
  string provider_id = 1;
  // The provider's literal status string. The provider package documents
  // the mapping to InstanceState; pushing the mapping into the adapter
  // keeps the wire vocabulary visible for debugging.
  string provider_state = 2;
  // Includes iplane-id and iplane-operator if iplane created the
  // instance.
  map<string, string> tags = 3;
  double hourly_rate_usd = 4;
  google.protobuf.Timestamp created_at = 5;
}

// Deployment is an engine container running on a previously-provisioned
// Instance. Locked by docs/design/0002-deploy.md -- see that doc for
// the rationale behind: declarative-semantics under imperative verb
// name, async-with-LRO state machine, exact-match drift detection on
// (image, model), audit-only engine config in v0.1.
message Deployment {
  // Operator-supplied identifier. Required. Tenant-globally unique
  // across all providers (separate namespace from Instance ids -- a
  // Deployment id and an Instance id can be the same string, they are
  // looked up in different tables).
  string id = 1;

  // Foreign key into Instance.id. The Deployment's target instance.
  // Required: every Deployment must name an existing Instance.
  string instance_id = 2;

  // Desired-state axis. Drift detection in v0.1 is exact-match on
  // (image, model) only. Engine config below is pass-through, audit-
  // only -- changing it does NOT cause re-deployment.
  string image = 3;
  string model = 4;

  // Pass-through configuration. Recorded for audit (so operators can
  // see what flags this deploy ran with) but NOT used to detect drift
  // in v0.1. v0.2's --engine-config <yaml> promotes a typed engine
  // config blob into desired state.
  repeated string engine_args = 5;
  map<string, string> env = 6;
  int32 engine_port = 7;

  DeploymentState state = 8;
  // Set when state == FAILED. Wraps the provider / SSH / docker
  // error message preserving the original text.
  string failure_reason = 9;

  // LRO progress fields. Updated by the executor as deploy proceeds.
  // Operators read via DescribeDeployment / WatchDeployment.
  string current_phase = 10;        // e.g. "ssh:connecting", "docker:pulling"
  string progress_message = 11;     // e.g. "pulling layer 4/12"

  google.protobuf.Timestamp created_at = 12;     // when PENDING was written
  google.protobuf.Timestamp started_at = 13;     // when STARTING entered
  google.protobuf.Timestamp ready_at = 14;       // when RUNNING entered
  google.protobuf.Timestamp terminated_at = 15;  // when TERMINATED entered

  // Container handle on the remote box. Filled when state >= STARTING.
  // Used by describe / status to query the live container via
  // `docker inspect`.
  string container_id = 16;

  // Engine's OpenAI-compat endpoint URL. Filled when state == RUNNING.
  // Phase 3 (telemetry seeding) and Phase 5 (`iplane up` UX wrapper)
  // both surface this to operators.
  string engine_endpoint = 17;

  // Operator wants shell-level access to the running engine pod
  // ("shell into the box running my model"). Provider-neutral intent;
  // each adapter translates to its own mechanism:
  //   - RunPod: allocate publicIp + NAT-map sshd (costs more, restricts
  //     placement to publicIp-capable hosts).
  //   - Lambda Labs / raw VMs (v0.2): no-op -- sshd is baseline; this
  //     just controls whether `inst.ssh` is populated.
  //   - Modal (later): satisfied via the provider's logs/exec UI;
  //     adapter may reject the request if shell isn't available.
  //   - k8s (v1.0): translates to a port-forward / kubectl exec hint.
  // Default false: the engine port goes through the provider's
  // managed proxy (no publicIp on RunPod, in-cluster service URL on
  // k8s) -- cheapest capacity, no debug side-channel.
  bool debug_shell = 18;

  // idle_ttl_seconds is the inactivity window after which v0.2's idle
  // reaper destroys this deployment. Zero means "TTL not set by
  // operator"; the reaper applies the profile default at evaluation
  // time (demo profile is low single-digit minutes; dev and prod
  // profiles longer). Mutated only at CreateDeployment time in v0.2.
  // Reads land in the reaper ticket; this field is persistence-only
  // until then.
  int32 idle_ttl_seconds = 19;

  // last_activity_at is the timestamp of the most recent activity
  // against this deployment. Activity covers two sources:
  //   - the data plane: an inference request entering the router.
  //   - the control plane: an operator-facing RPC against this
  //     deployment (describe, watch, touch).
  // Nil means "never touched since creation"; the reaper treats nil
  // with a non-zero TTL the same as last_activity_at = created_at.
  // Written by the router and by DeploymentService RPC handlers;
  // read by the reaper. Touch (v0.2 ch7-beat1.8) is the operator-
  // facing reset.
  google.protobuf.Timestamp last_activity_at = 20;

  // no_idle_destroy pins the deployment: when true, the idle reaper
  // skips it entirely. Operator sets it at CreateDeployment time
  // (--no-idle-destroy flag in v0.2 ch7-beat1.9); flipping it later
  // requires the unpin verb (system-hygiene). Use case: the shared
  // deployment across Ch 7's demos is pinned at the start of the
  // session so afk pauses do not tear it down.
  bool no_idle_destroy = 21;

  // Field 22 was Deployment.default_priority (Priority enum) in an
  // earlier draft of v0.2 ch7-beat2.3. Removed before merge: priority
  // Slots 22 and 23 were briefly used in pre-merge drafts (a
  // Deployment.default_priority field and a homogeneous replicas
  // int) -- both removed before merge once we worked out that
  // priority is request-traffic-level, not artifact-level, and
  // that a homogeneous count duplicates k8s without surfacing
  // iplane's heterogeneous-fleet differentiator. Pre-publication,
  // `reserved` markers are not warranted (no deployed wire
  // consumers to protect from slot re-use); the slots are simply
  // free for re-use if needed.

  // instance_ids is the full list of Instances that back this
  // Deployment (v0.2 ch7-beat3.1). One Deployment, N Instances --
  // each Instance was provisioned independently and may differ in
  // provider / GPU class / region. Beat 3 fan-out (#84) writes
  // this list at CreateDeployment time (for the --replicas N sugar)
  // or via the add-instance verb (for heterogeneous composition).
  // Beat 3 router fan-out (#85) reads this list to pick which
  // engine endpoint a request goes to.
  //
  // Backward-compat with v0.1's single-instance contract: when
  // instance_ids is empty (legacy 1.2 records), readers treat the
  // singular `instance_id` field as the only entry. The
  // EffectiveInstanceIDs helper (added in #84) encapsulates this
  // fallback so callers don't branch on emptiness themselves.
  //
  // The singular `instance_id` field at slot 2 stays for v0.1
  // backward-compat: for one-instance deployments it remains the
  // canonical primary; for multi-instance deployments it equals
  // instance_ids[0] (the first-provisioned instance).
  repeated string instance_ids = 24;

  // engine_endpoints is the parallel list to instance_ids: position i
  // holds the engine endpoint URL for instance_ids[i], or empty
  // string while that instance hasn't reached RUNNING yet (v0.2
  // ch7-beat3.2 / #84-#85). Maintained by the Service as the single
  // writer; the router reads it to pick which endpoint a request
  // goes to via round-robin (and future per-replica policies).
  //
  // Invariant: when populated, len(engine_endpoints) ==
  // len(instance_ids). Empty list (Beat 1+2 single-instance
  // Deployments) means "fall back to the singular engine_endpoint
  // field at slot 17." The EffectiveEndpoints helper encapsulates
  // this fallback.
  //
  // Why denormalized on Deployment rather than fetched per-request
  // from each Instance: the Service is the single writer of
  // deployment state and naturally knows both the instance set and
  // each engine's endpoint at deploy time. Snapshot-on-Deployment
  // means the router does 1 RPC per request (DescribeDeployment)
  // instead of 1 + N. Consistency is the Service's problem -- a
  // future cache invalidator (#88+) layers on top without
  // restructuring this field.
  repeated string engine_endpoints = 25;

  // unhealthy_instance_ids is the parallel set of Instance IDs that
  // the health-poll loop has currently marked unhealthy. Position-
  // independent: the router treats membership in this set as the
  // signal to skip the corresponding entry in instance_ids /
  // engine_endpoints. v0.2 ch7-beat3.5 (#87).
  //
  // Why a parallel set, not a state flag on each instance: the
  // router already does an effective_endpoints lookup per request;
  // adding a small set membership check is O(k) where k = number
  // of replicas (small). A per-instance state enum would have
  // required a proto restructure to `repeated Replica` and would
  // have invalidated the parallel-arrays shape #84/#85 just
  // landed on.
  //
  // Mutation contract: only the health-poll loop writes this field.
  // It calls Quarantine(deploy, instance) on the deployment service
  // after K consecutive /health failures, and Restore(deploy,
  // instance) after K consecutive successes when previously
  // quarantined. The engine endpoint in engine_endpoints[i] is
  // preserved across quarantine; restore is set-removal, not
  // re-discovery.
  //
  // Persistence: this field is persisted to the state file so
  // operator-visible quarantine state survives daemon restart. The
  // K-of-K streak counters are in-memory only; a restart resets
  // them, which means a quarantined replica may take an extra K
  // ticks to restore after the daemon comes back -- acceptable
  // since restart is rare.
  repeated string unhealthy_instance_ids = 26;

  // Credential the router presents when forwarding to this
  // deployment's engine. Set for attached engines that sit behind an
  // authenticating gateway: a hosted OpenAI-compatible API, or an
  // operator's own vLLM behind an ingress that checks a token.
  //
  // Unset for everything iplane provisions itself. A rented pod is
  // reachable because we rented it, not because we hold a key for it.
  UpstreamAuth upstream_auth = 30;

  // How the engine should split the model across the cards it was
  // given. Unset means the engine decides, which for a single card is
  // the only sensible answer.
  Parallelism parallelism = 31;

  // replica_specs records the per-slot ReplicaSpec each slot was
  // originally provisioned from (heterogeneous form) or derived
  // from (homogeneous form: one entry replicated len(instance_ids)
  // times via resolveCreateReplicaSpecs). Parallel to instance_ids
  // / engine_endpoints / unhealthy_instance_ids; position i is the
  // spec for instance_ids[i]. v0.2 ch7-beat3.9 (#143).
  //
  // This is the operator's *intent* shape: class="small" stays
  // "small" here even after the provider resolved it to a concrete
  // SKU at rent time (the resolved form lives on Instance.spec.
  // requirements -- two complementary views).
  //
  // Used by:
  //   - #93's reconciliation loop: retry a failed slot with the
  //     same spec the operator asked for, even if the dead
  //     Instance is gone from the state file.
  //   - Scale operations: anchor off dep.replica_specs[0] instead
  //     of looking up the slot-0 Instance for the homogeneous
  //     target_replicas form.
  //   - Describe / audit: surface what the operator actually
  //     asked for, not just what got rented.
  //
  // Empty list for Beat 1+2 single-instance legacy deployments
  // (which fell back to the singular instance_id). Beat 3
  // deployments always populate this in lockstep with the other
  // parallel arrays.
  repeated ReplicaSpec replica_specs = 27;

  // mounts are filesystem mounts the deployment's engine needs, set
  // by the Service from the ModelStore's Resolved.Mounts at
  // CreateDeployment time (empty for the default HF-passthrough store,
  // which downloads weights inside the pod). A warm-cache store
  // (RunPodVolumeStore) fills this so the engine loads a model already
  // staged on a persistent volume instead of re-downloading it every
  // deploy.
  //
  // The field is provider-agnostic on purpose: it names a mount, not a
  // provider primitive. Each deploy path maps it onto its own
  // mechanism -- the RunPod Deployer onto networkVolumeId, the
  // sshdocker executor onto a `docker run -v` bind -- and paths with no
  // volume mechanism take the cold download path. Keeping the seam free
  // of networkVolumeId / -v keeps adding a new provider's volume impl a
  // new file, not a proto change.
  //
  // Field 22/23 were the removed default_priority draft; 28 is the next
  // free number (kept distinct so that history note stays intact).
  repeated VolumeMount mounts = 28;

  // engine_entrypoint is the command that starts the engine inside the
  // image, e.g. ["vllm", "serve"] or ["python3", "-m",
  // "vllm.entrypoints.openai.api_server"].
  //
  // Normally empty, and normally it should stay that way. iplane has never
  // needed to know this: it replaces the image's CMD with the engine's
  // arguments and lets the image's own ENTRYPOINT supply the binary.
  //
  // It exists for one case. Running the registration agent beside the
  // engine on the image-native path means overriding the container's
  // entrypoint with a wrapper, and a wrapper has to exec the engine
  // itself, so it needs a command that iplane otherwise never sees. There
  // is no safe default to infer: vllm/vllm-openai changed its entrypoint
  // between the versions Ch 9 uses, so guessing would break deploys to
  // make a fleet view nicer.
  //
  // Set it and the agent runs. Leave it and the deployment still works
  // exactly as before, with liveness coming from the /health poller. The
  // sshdocker path never needs this: it runs the agent as a separate
  // container and leaves the engine's entrypoint alone.
  repeated string engine_entrypoint = 29;
}

// VolumeMount is one filesystem mount a deployment's engine needs. The
// three fields cover the two deploy paths without either leaking into
// the other:
//
//   - volume_id is a provider-managed volume handle (a RunPod network
//     volume id today; a Lambda filesystem id later). The image-native
//     deploy path attaches it by id; the provider schedules the pod in
//     the volume's datacenter.
//   - host_path is a directory already present on the host, bind-
//     mounted by the sshdocker deploy path (`docker run -v
//     host_path:mount_path`). Empty when volume_id drives the mount.
//   - mount_path is the in-container path the engine sees. Always set;
//     the model store points HF_HOME at it so the engine finds the
//     staged weights.
//   - provider namespaces volume_id. A volume handle only means
//     something to the provider that issued it (a RunPod networkVolumeId
//     is meaningless to Lambda), so the deploy path refuses to attach a
//     mount whose provider does not match the replica's placement
//     provider -- otherwise a cross-provider mount would silently fall
//     back to a cold download instead of failing loudly. Empty provider
//     skips the check (host_path binds, which are not provider-scoped).
//
// An adapter uses the fields its provider primitive supports and
// ignores the rest. Mirrors modelstores.Mount.
message VolumeMount {
  string volume_id = 1;
  string host_path = 2;
  string mount_path = 3;
  string provider = 4;
}

// Candidate is one thing a provider would rent us, carrying what a
// placement decision turns on rather than the provider's whole record.
//
// Everything here is provider-reported unless noted. A field the
// provider does not fill stays zero, and a caller must read that as
// "not reported" rather than as a measurement. The fabric fields carry
// their own provenance for exactly that reason.
message Candidate {
  // Provider this came from. Stamped by the Service after the adapter
  // returns, so a candidate cannot be mislabelled and a merged list
  // from several providers is self-describing.
  string provider = 1;

  // host_id identifies the physical machine behind an offer, stable
  // across the offers that come and go on it. Separate from offer_id
  // because on a marketplace they are different lifetimes: an offer
  // disappears when somebody rents it while the host is still the
  // host, and "do not place on this box again" is a statement about
  // the host. Empty where the provider has no such notion.
  string host_id = 2;

  // offer_id is what a Spawn would name. Short-lived on a marketplace,
  // so it is useful for acting on a candidate now and worthless for
  // remembering one.
  string offer_id = 3;

  // sku in the adapter's vocabulary rather than the provider's wire
  // form, so it round-trips back as --gpu-sku.
  string sku = 4;

  // region as the provider labels it. Empty where a provider does not
  // pin placement or does not say.
  string region = 5;

  // price_usd_per_hour is the provider's live quote for this
  // candidate, for the whole shape at the requested width rather than
  // per card. Every adapter converts to that unit, because a merged
  // list ranked on a mix of per-card and per-shape prices is wrong in
  // a way nobody can see.
  double price_usd_per_hour = 6;

  int32 gpu_count = 7;
  int32 vram_gb_per_gpu = 8;

  // architecture is the host CPU architecture, normalized ("amd64",
  // "arm64"), empty where unreported. Typed rather than a provider
  // attr because it decides whether a deploy works at all: an arm64
  // host needs an arm64 engine image. Providers spell the same fact
  // differently, which is what the normalization is for.
  string architecture = 9;

  // reclaimable says the provider can take this capacity back, which
  // is why it is cheaper. It changes what the price means: an hourly
  // rate on capacity that can vanish is not comparable with one that
  // cannot.
  bool reclaimable = 10;

  // Fabric verdict, flattened the same way Hardware flattens it. The
  // source is what stops an unmeasured candidate reading as a zero: a
  // ranking that treated UNKNOWN as no-fabric would let a provider
  // that publishes nothing beat one that does.
  FabricScope fabric_scope = 11;
  FabricSource fabric_source = 12;
  int32 fabric_gbps = 13;
  string fabric_technology = 14;

  // attrs carries the provider-reported values the adapter filtered
  // on, so an operator can see why a candidate is in the list. Keys
  // are the provider's own field names.
  //
  // Deliberately NOT where cross-provider facts live. Everything here
  // is an untyped string under one vendor's key, so it cannot be
  // compared against another vendor's record and must never feed a
  // ranking. A fact that matters on a second provider gets promoted to
  // a typed field and normalized.
  map<string, string> attrs = 15;
}

// AnswerOutcome is what one provider did when asked for capacity.
//
// Four states rather than an empty list, because the three ways to
// contribute nothing are different findings and an operator acts on
// each differently. Only NO_CAPACITY says anything about the market.
enum AnswerOutcome {
  ANSWER_OUTCOME_UNSPECIFIED = 0;
  // Answered with candidates.
  ANSWER_OUTCOME_ANSWERED = 1;
  // Answered, and has nothing matching. A fact about the market.
  ANSWER_OUTCOME_NO_CAPACITY = 2;
  // Has no way to answer at all. A fact about the provider's API, and
  // the reason to look somewhere else for the information.
  ANSWER_OUTCOME_CANNOT_ANSWER = 3;
  // Could have answered and did not. Retry, or check a credential.
  ANSWER_OUTCOME_FAILED = 4;
}

// ProviderAnswer is one provider's response, kept whole rather than
// folded into a combined list.
message ProviderAnswer {
  string provider = 1;
  AnswerOutcome outcome = 2;
  repeated Candidate candidates = 3;
  // error carries the provider's own words when outcome is FAILED.
  // Empty otherwise.
  string error = 4;
}

// FactGap records one fact that some answering providers reported and
// others did not, which is the common case rather than the edge case.
message FactGap {
  string fact = 1;
  repeated string reported_by = 2;
  repeated string missing_from = 3;
}

// Comparability describes what a merged candidate list can honestly be
// compared on.
//
// It exists because the failure it prevents is invisible. Put several
// providers' candidates in one table and the eye ranks them; a row with
// an empty column reads as neutral rather than as unknown, so a
// provider that publishes less looks no worse than one that publishes
// more. This reports, and never filters or reweights.
message Comparability {
  // Facts every answering provider populated, so a column-by-column
  // reading of those is sound.
  repeated string compared = 1;
  // Facts reported unevenly. A candidate missing one is unmeasured on
  // it, not worse, and nothing should be concluded from the blank.
  repeated FactGap gaps = 2;
}

// Placement is a decision about where to put something, with enough of
// the reasoning to argue with.
//
// A placement an operator cannot interrogate is one they take on trust,
// and "why did it pick that" is the first question anyone asks of an
// automatic choice.
message Placement {
  Candidate winner = 1;
  // The next few that lost, cheapest first. Enough to see whether the
  // decision was close, not so many that the answer is another list.
  repeated Candidate runners = 2;
  // Every candidate across every answering provider, so the operator
  // can tell a decision made from three options from one made from
  // three hundred.
  int32 considered = 3;
  // Per-provider outcomes behind the decision, so a placement made
  // while one vendor was unreachable says so rather than looking like
  // a survey of the whole market.
  repeated ProviderAnswer answers = 4;
  // What the ranking could honestly compare. A cheapest-fit decision
  // across providers that report different facts is still the
  // cheapest, and is not necessarily the best.
  Comparability comparability = 5;
}

// Parallelism is how many ways an engine splits a model across the cards
// it was handed.
//
// The control plane does not implement either kind of parallelism and
// never looks inside the engine, which is the line this project has kept
// since the caching chapter. What it does is refuse a split the hardware
// cannot carry, which is a check only it can make: the engine discovers
// the mismatch when it starts and dies, minutes after the rental began
// billing, while the control plane knows the card count before renting
// anything.
//
// Both fields are engine-facing rather than provider-facing. They travel
// to the engine as arguments, so the vocabulary question is which
// engine's spelling to use, not which vendor's.
message Parallelism {
  // Cards a single layer is sharded across. Every card holds a slice of
  // every layer, so the per-layer exchange runs on the critical path of
  // every token and wants a fast intra-node link.
  int32 tensor_parallel_size = 1;

  // Stages the model's layers are split into. Stages talk once per
  // micro-batch boundary rather than per layer, which is why this is
  // the split that tolerates a slower link between nodes.
  int32 pipeline_parallel_size = 2;
}

// UpstreamAuth names a credential without carrying it.
//
// value_env holds the NAME of an environment variable, never the secret
// itself. That distinction is the whole design: this message is
// persisted to the state file and returned by DescribeDeployment, so a
// literal token here would be written to disk in plaintext and handed
// to anyone who can read a deployment. The router resolves the variable
// at forward time instead, so the secret lives only in the daemon's
// environment, which is the same place every provider API key already
// lives (see internal/provisioners/apikey.go).
//
// A proper secret store is a later concern. This is deliberately the
// same shape as the existing provider-key handling rather than a new
// mechanism nobody has operational experience with.
message UpstreamAuth {
  // Header to set on the forwarded request. Usually "Authorization",
  // but some gateways want their own ("X-Api-Key").
  string header = 1;

  // Name of the environment variable holding the credential. NOT the
  // credential.
  string value_env = 2;

  // Prefix joined to the resolved value, typically "Bearer ". Kept
  // separate so the env var holds the bare token, which is how vendors
  // issue them and how operators paste them.
  string value_prefix = 3;
}

// Volume is the registry record for a persistent provider volume that
// models are pre-staged onto, so warm-cache deploys mount weights
// instead of re-downloading them. One volume is a shared cache: it
// holds many models (the HuggingFace hub layout keeps them side by side
// under one HF_HOME), and models accumulate as they are pinned.
//
// A volume is datacenter-locked, so serving a model in two regions needs
// it staged on one volume per region -- replication is per-region, not a
// property of a single record.
// ModelArchitecture is the part of a model fixed at training time: what
// the VRAM budget reads to work out whether the model fits the cards
// before any of them are rented.
//
// Every field is published by the model rather than chosen by the
// operator, which is the line separating this message from the deploy-
// time knobs (precision, context length, batch, parallelism) that live
// elsewhere. Absent means unknown and never zero. A budget computed from
// a zero layer count reports no KV cache at all, which is a budget that
// says yes to everything.
message ModelArchitecture {
  // Total parameter count, from the hub's tensor accounting rather than
  // from the model's name. A name is a label the uploader chose.
  int64 params = 1;
  // Transformer blocks (num_hidden_layers).
  int32 layers = 2;
  // Key-value heads (num_key_value_heads). Grouped-query attention
  // shares one KV head across a group of query heads, so the cache
  // scales with this count rather than with the attention-head count.
  // A model without GQA publishes no separate figure, and absent there
  // means "as many as there are attention heads".
  int32 kv_heads = 3;
  // Dimension of a single attention head. Optional in a published
  // config and derivable, since hidden_size is by construction this
  // times the attention-head count.
  int32 head_dim = 4;
  // Model dimension (hidden_size). Read only by the activation
  // estimate, which is the budget's coarsest term.
  int32 hidden_size = 5;
}

// DescribeModelRequest asks what a model spec resolves to.
//
// This is a read behind the wire contract rather than a local one,
// because answering it needs the hub credential, and that lives in the
// daemon's environment. A CLI host without HF_TOKEN answering from its
// own process would report a gated model as unreadable while the daemon
// could read it perfectly well -- the shape of the bug that shipped
// twice already, in the capacity search and in the pin registry.
message DescribeModelRequest {
  // Operator-supplied spec, `<org>/<name>` with an optional
  // `:<revision>` suffix.
  string model_spec = 1;
}

// DescribeModelResponse carries what the hub published about a model.
message DescribeModelResponse {
  ModelArchitecture architecture = 1;
}

message Volume {
  // id is the provider-issued volume handle (a RunPod networkVolumeId).
  string id = 1;
  // provider that issued the volume; namespaces id and gates which
  // deployments may mount it (see VolumeMount.provider).
  string provider = 2;
  // region / datacenter the volume lives in. A pod must be scheduled
  // here to mount it.
  string region = 3;
  // name is the operator-visible label (the deterministic per-region
  // cache name, or an operator-supplied one).
  string name = 4;
  // size_gb is the provisioned capacity.
  int32 size_gb = 5;
  // models is the set of model specs staged onto this volume. Pinning is
  // additive; unpinning a single model removes its entry.
  repeated string models = 6;
  // mount_path is where the volume attaches in a pod and where HF_HOME
  // points (the staged HuggingFace cache lives under mount_path/hf).
  string mount_path = 7;
  google.protobuf.Timestamp created_at = 8;
}

// ReplicaSpec describes one *instance group* in the fleet: N units
// of one (provider, region, requirements) shape. Used in two ways:
//
//   - Request form: CreateDeploymentRequest.replicas_spec /
//     ScaleDeploymentRequest.add_replicas. The operator submits a
//     compact list -- e.g., [{runpod, small, replicas=3}] for "three
//     small RunPods" or [{runpod, small, 2}, {vast, medium, 1}] for
//     "two small RunPods plus one medium Vast." replicas defaults to
//     1 when omitted (proto3 zero-value semantics; Service normalizes
//     on receive).
//
//   - Persisted form: Deployment.replica_specs is the *expanded*
//     per-slot view: one entry per actual slot, always replicas=1.
//     resolveCreateReplicaSpecs expands a request's compressed form
//     into the per-slot list. The expansion direction is fixed: the
//     parallel-arrays invariant (instance_ids[i] <-> replica_specs[i])
//     stays clean, and #93's reconciliation reads one spec per slot
//     without having to do count arithmetic.
//
// The instance-group framing is the architectural seam that #147's
// cloud-native delegation reads: one ReplicaSpec entry with
// replicas=N is literally a fleet description that can map directly
// to AWS ASGs / GCP MIGs / RunPod fleet APIs (when providers ship
// the corresponding GroupProvisioner capability). Heterogeneous
// requests stay on iplane-side fan-out because no single cloud's
// group primitive spans clouds.
//
// Lives in types.proto (not service.proto) because Deployment
// references it -- types.proto can't import service.proto, so the
// shared message belongs here.
message ReplicaSpec {
  // Provider to provision this group's replicas on. Required.
  string provider = 1;
  // Region hint passed to the provider when supported. Optional.
  string region = 2;
  // Resource requirements shared by all replicas in this group.
  // Same three-layer shape as the original homogeneous form:
  // class shorthand, numeric floors, or exact sku. Required.
  ResourceRequirements requirements = 3;
  // Number of replicas in this group. Default 0 means 1 (proto3
  // zero-value normalization). On the persisted Deployment.replica_specs
  // view this is always 1 (the request's compressed N expands to
  // N one-each entries).
  int32 replicas = 4;

  // engine_endpoint is the pre-existing engine URL for the "external"
  // provider -- an engine the operator runs themselves (on-prem vLLM,
  // a k8s Service, or a local `iplane mock-engine`). When set with
  // provider="external", iplane registers a RUNNING replica pointing
  // at this URL instead of provisioning anything. Ignored by owning
  // providers (runpod/vast/lambdalabs/local). One endpoint per replica,
  // so the multi-endpoint form expands to N one-each ReplicaSpec entries.
  string engine_endpoint = 5;
}

// Priority is the lane an inbound request joins on its way to the
// engine. Two values in v0.2: interactive (low-latency, user-facing)
// and batch (high-throughput, bulk). The scheduler that decides
// which lane to drain when lands in v0.2 ch7-beat2.4; this enum
// just labels the request so the lane structure can be plumbed.
//
// Priority is a request-level concept -- the router maps inbound
// requests onto lanes based on the X-IPlane-Priority header (or a
// router-level default for unannotated traffic). No Deployment-side
// proto field carries a priority; the engine itself is
// priority-blind.
//
// Forward-compat: numeric values are stable; appending future
// priorities (e.g., BACKGROUND, REALTIME) does not break readers
// pinned to ch07-final.
enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  // User-facing traffic; should not wait behind bulk work.
  PRIORITY_INTERACTIVE = 1;
  // Bulk traffic; tolerates higher tail latency in exchange for
  // throughput.
  PRIORITY_BATCH = 2;
}

enum DeploymentState {
  DEPLOYMENT_STATE_UNSPECIFIED = 0;
  // Record written; executor has not started.
  DEPLOYMENT_STATE_PENDING = 1;
  // SSH + docker pull + docker run in progress.
  DEPLOYMENT_STATE_STARTING = 2;
  // Container started; engine loading model.
  DEPLOYMENT_STATE_CONFIGURING = 3;
  // Engine healthy; serving inference.
  DEPLOYMENT_STATE_RUNNING = 4;
  // Container alive but engine unhealthy.
  DEPLOYMENT_STATE_DEGRADED = 5;
  // Destroy in progress.
  DEPLOYMENT_STATE_TERMINATING = 6;
  // Terminal success.
  DEPLOYMENT_STATE_TERMINATED = 7;
  // Terminal failure (deploy or runtime).
  DEPLOYMENT_STATE_FAILED = 8;
}

// EngineState is what a registered engine reports about itself. Wider than
// the router's healthy/quarantined pair, because a probe answers a question
// the control plane already thought to ask and cannot describe a group.
//
// Two of these have no single-card equivalent and are the reason the
// registry exists alongside the /health poller:
//
//   - ASSEMBLING: processes are alive and the group has not formed. Four
//     workers running is not four workers in one group; they have to find
//     each other and settle ranks before the endpoint serves a token. No
//     probe can see this, because there is no endpoint yet to ask.
//   - SERVING_DEGRADED: the group assembled, serves correct tokens, and lost
//     a large fraction of its throughput because a link inside it is down.
//     /health says "serving", which is true, and useless.
enum EngineState {
  ENGINE_STATE_UNSPECIFIED = 0;
  // Some workers joined, the group has not formed. No endpoint yet.
  ENGINE_STATE_ASSEMBLING = 1;
  // Group formed, endpoint answering.
  ENGINE_STATE_SERVING = 2;
  // Assembled and correct, running well below expected throughput.
  ENGINE_STATE_SERVING_DEGRADED = 3;
  // The control plane stopped hearing from it: the lease expired. Set by the
  // sweeper, never reported by an engine about itself.
  ENGINE_STATE_LOST = 4;
  // Taken out of service on purpose: new work is no longer routed here and
  // the engine is finishing what it has. Operator-initiated (issue 205's
  // fleet drain), so like LOST it is the control plane's word rather than
  // the engine's, and unlike LOST it is not a failure.
  ENGINE_STATE_DRAINING = 5;
}

// InterconnectHealth is what one node can see about the fast links between
// its own cards. Ch 10's headline observable, and the one reading that
// distinguishes a group serving at full speed from one serving correctly at a
// fraction of it.
//
// The `available` flag is the load-bearing field, not the counts. A node with
// no NVLink (a PCIe-only box) and a node whose provider hides the NVIDIA
// tooling inside the container are both "no reading", and neither is
// "zero links up". Collapsing those would either invent a fault on every PCIe
// pool or hide one on every pool without a sensor, so absence is reported as
// absence and the counts are meaningless unless available is set.
message InterconnectHealth {
  // False means no reading: no NVLink on this node, or no sensor reachable.
  // Every field below is meaningless when this is false.
  bool available = 1;
  // Links the node reports, and how many of them are up. Equal counts are a
  // healthy board; up < total is the impairment the chapter is about.
  int32 links_total = 2;
  int32 links_up = 3;
}

// EngineNode is one machine an engine spans. The fact no probe can report,
// and the input failure attribution needs: when a member dies, which node
// took it down (issue 214).
message EngineNode {
  // Provider-assigned host identity. RunPod's top-level machineId, Vast's
  // machine_id, an EC2 instance id. Opaque to the control plane and only
  // meaningful to the provider that issued it.
  string host_id = 1;
  // Provider that issued host_id, so two providers' identifiers cannot
  // collide.
  string provider = 2;
  // Rank of this node within the engine's group, 0-based. The engine assigns
  // it; the control plane never interprets it beyond ordering the display.
  int32 node_index = 3;
  // GPUs this node contributes to the group.
  int32 gpu_count = 4;
  // Link health between this node's own cards. Per-node rather than
  // per-engine because the links are physical hardware on one machine: a
  // four-node group can have three healthy boards and one impaired, and an
  // engine-level summary would say only "something is wrong somewhere".
  InterconnectHealth interconnect = 5;
}

// Engine is one registered data plane: an endpoint serving one model over a
// span of nodes and cards.
//
// Deliberately NOT a field on Deployment. An engine that announces itself
// need not have been rented by us, which is what makes a fleet of
// operator-run engines expressible later; deployment_id links the two when
// the engine does correspond to something we provisioned.
message Engine {
  // Engine-chosen stable identity. Survives re-registration: registering
  // twice with the same id is a renewal, not a second member.
  string id = 1;
  // Set when this engine runs on a deployment the control plane created.
  // Empty for engines that registered themselves without being provisioned.
  string deployment_id = 2;
  string model = 3;
  // The single OpenAI-compatible endpoint, regardless of span. One engine is
  // one endpoint whether it holds one card or sixteen.
  string endpoint = 4;

  EngineState state = 5;
  // Nodes this engine spans, in node_index order. Length 1 is the ordinary
  // single-machine case, not a special case.
  repeated EngineNode span = 6;

  // Operational readings the engine computes anyway. Observational only:
  // routing decisions must not consume these. The router keeps its own
  // in-flight counts precisely so a routing decision never depends on an
  // observation pipeline being up.
  int32 in_flight = 7;
  double cache_utilization = 8;

  google.protobuf.Timestamp registered_at = 20;
  google.protobuf.Timestamp last_seen_at = 21;
  // When the current lease runs out. Past this with no renewal, the sweeper
  // moves the engine to LOST.
  google.protobuf.Timestamp lease_expires_at = 22;
}
