# What actually shipped at each chNN-final tag.
#
# This file is forward-only (snapshots are immutable once their tag is
# cut). The ROADMAP is forward-looking; this file is what we delivered.
# The book renders a per-chapter capability table from these snapshots
# so readers see, at the tag for the chapter they're on, exactly which
# capabilities are alive and which got deferred.
#
# Schema notes:
#   - One YAML doc, top-level `snapshots` list.
#   - Each snapshot covers one ch{NN}-final tag.
#   - `status` on a capability is `shipped` | `deferred` | `partial`.
#   - `deferred` capabilities carry `moved_to` so the chapter can
#     forward-link the reader correctly.
#   - `prs` / `commits` / `docs` are operator-facing references.
#   - Add a new snapshot above the previous one when the next tag cuts;
#     newest snapshot at the top of the list.

snapshots:

  - tag: ch09-final
    alias: v0.2.2
    chapter: 9
    chapter_title: Scaling to 30B+ Models
    branch: release/v0.2
    date: 2026-08-08

    summary: |
      Cold-start distance. Chapter 8 kept every engine one opaque endpoint and
      deferred the question of what a big model costs to hold; this chapter
      answers it on one card. The control-plane surface is small on purpose,
      because most of the chapter is engine and model arithmetic (the VRAM
      budget, quantization formats, and the engine knobs that split a card)
      rather than new iplane machinery. What iplane adds is the warm model
      cache: a pin registry that pre-stages weights onto a provider volume,
      provider-scoped mounts that a deploy resolves without configuration, and
      a `storage_tier` cut on the deploy metrics so the saving is measured
      rather than asserted. Validated end-to-end on a 72B FP8 flagship on a
      single B200: 2692 s cold to 244 s warm, about 11x, roughly $4.41 to
      $0.40 per deploy. The engine stays opaque and single-card throughout;
      spreading one engine's KV domain across several GPUs is Chapter 10.

    capabilities:

      - name: Warm-cache volume mounts across deploy paths
        status: shipped
        notes: |
          `Service` stamps `Resolved.Mounts` onto a provider-agnostic
          `VolumeMount{volume_id, host_path, mount_path, provider}`, and each
          adapter maps it onto its own primitive: the RunPod adapter onto
          `networkVolumeId`, the sshdocker executor onto `docker run -v`. The
          mount is the seam, so a provider that has no persistent volume simply
          cannot be pinned and says so rather than failing a deploy.
        prs: [197]
        related_issues: [190]

      - name: Pin registry and RunPod volume mechanism
        status: shipped
        notes: |
          `Volume` proto plus `State.Volumes` (state schema 1.6, additive) and
          the `VolumeManager` optional provider capability: RunPod
          network-volume CRUD plus `StageModel`, which runs a cheap CPU setup
          pod to download the weights onto the volume. A cross-provider mount
          guard rejects attaching one provider's volume handle to another's
          pod, because a RunPod volume id means nothing to Lambda Labs.
          Shipped generic under `internal/modelstores/volumecache`; the
          `CachedStore` / `RunPodVolumeStore` names sketched on the roadmap did
          not survive contact.
        prs: [199]
        related_issues: [191]

      - name: iplane model pin / ls / unpin
        status: shipped
        notes: |
          The operator surface over the pin registry, in-process and
          pin-before-serve. `iplane model pin <model> --provider --region
          --size --hf-token --force` stages weights onto a volume,
          `iplane model ls --provider` lists volumes and what is on them, and
          `iplane model unpin <volume-id> --model` removes one model or
          destroys the whole volume. `--region` is required because a volume
          only helps a deploy landing in its own datacenter.
        prs: [200]
        related_issues: [191]

      - name: Deploy auto-resolves the pinned volume
        status: shipped
        notes: |
          A deploy joins `(model, provider, region)` against the pin registry
          and mounts the matching volume with no configuration and no new
          flag. The cache fails soft: with nothing pinned, or a volume that
          does not hold the model, `HF_HOME` still points at a real Hugging
          Face cache so the engine downloads instead of refusing to start. A
          missing pin costs a cold deploy, not a failed one.
        prs: [201]
        related_issues: [191]

      - name: Cold-start SLI (storage_tier)
        status: shipped
        notes: |
          A `storage_tier` label (`cold` = in-pod HF download, `warm` =
          pre-staged volume mount) on the deploy phase and provision metrics,
          plus the warm-vs-cold engine-init Grafana panel. Derived from
          `dep.Mounts` in the deploy observer, so the provider adapters stay
          OTel-free and the CP/DP-1 boundary holds. This is what turns the
          warm cache from a claim into a measured gap. See the phase-
          attribution limitation below.
        prs: [198]
        related_issues: [192]

      - name: Engine-args pass-through
        status: shipped
        notes: |
          `iplane deployment deploy --engine-args` forwards engine flags
          (`gpu_memory_utilization`, `max-model-len`, `kv-cache-dtype`, the
          quantization selection) as an opaque list. Deliberately a
          pass-through and not first-class proto fields: placement is a
          control-plane concern, how a model splits a card it has been given
          is the engine's own arithmetic, and promoting engine flags would tie
          the control plane's release cycle to the engine's.
        prs: []
        related_issues: []

      - name: Large-model RunPod hardening
        status: shipped
        notes: |
          What the live 72B run cost to make repeatable: a SKU catalog,
          container-disk sizing, and three aligned timeouts (CLI `--wait`,
          daemon engine-ready, and the staging pod). Staging completion
          changed mechanism, from polling `desiredStatus` (RunPod never
          reports a one-shot command's exit) to reading a marker off the v2
          pod-logs stream. The download uses `hf download --max-workers 2`;
          `huggingface-cli` is gone, and 8 workers OOM the ~4 GB staging pod
          on 70B+ models.
        prs: [206]
        related_issues: []

      - name: Scaling-to-30B walkthrough
        status: shipped
        notes: |
          `examples/08-scaling-30b/` in five acts: 08a cold-start-distance
          (the warm-cache A/B, the one validated against real hardware), 08b
          quantization, 08c engine-partition, 08d placement, 08e
          single-gpu-ceiling. 08a is the paid act and carries the measured
          numbers the chapter's figures are drawn from.
        prs: [206]
        related_issues: []

      - name: Remote --service-url pin
        status: deferred
        notes: |
          `iplane model pin` is in-process only. Driving the pin registry
          against a remote daemon over `--service-url`, the way the other
          verbs already work, is not wired.
        moved_to: v0.3

      - name: S3Store / GCSStore object-store staging
        status: deferred
        notes: |
          Volume staging is provider-scoped, so a pin buys nothing across
          providers or regions. Object-store backed staging is the robust
          cross-provider path; the per-provider volume-create matrix (Lambda
          filesystem-create is API-blocked, AWS/GCP are the clean home) is
          worked out in docs/design/0004-cross-provider-warm-cache.md.
        moved_to: v0.3

      - name: Engine-image cold-start reduction
        status: deferred
        notes: |
          Pinning removes the weight download and does nothing for the ~20 GB
          engine image, which both cold and warm deploys pay. Slimmer images,
          registry proximity or a pull-through cache, image streaming, and
          warm pools are the levers; design in
          docs/design/0005-engine-image-coldstart.md.
        moved_to: v0.3

    cli_surface:
      # New at this tag (additive over ch08-final):
      - iplane model pin <model> --provider --region --size --hf-token --force
      - iplane model ls --provider
      - iplane model unpin <volume-id> --model
      - iplane deployment deploy --engine-args

    environment_variables:
      recommended:
        - name: IPLANE_RUNPOD_ENGINE_READY_TIMEOUT
          notes: "Daemon-side engine-/health wait. The 10m default is too short for a real cold deploy of a large model behind a multi-GB image pull."
        - name: HF_TOKEN
          notes: "Propagated onto the staging pod and the engine pod for gated models; iplane model pin --hf-token overrides it."

    known_limitations:
      - id: image-pull-phase-measures-zero
        resolved_by: 210
        resolved_date: 2026-08-09
        notes: |
          RESOLVED after this tag, in PR 210. Recorded here as it stood at
          ch09-final, with the resolution appended, because the limitation is
          what the tagged code actually did.

          As of the tag: the deployer defines a three-rung readiness ladder
          (runpod:scheduling -> runpod:image-pull -> engine:init; the separate
          runpod:create-pod phase is emitted earlier in the deploy and is not
          part of the /health wait), but in both validated runs the image-pull
          bucket came out at or near zero and engine:init absorbed the whole
          cold start. A ~20 GB image pull cannot take 0s, so the
          `lastStartedAt` signal the ladder keys on was not doing its job.
          Practical consequence at the tag: engine:init was image-pull +
          weight-download + model-load fused, so the warm-vs-cold totals are
          honest but the image slice could not be attributed.

          Resolution: the hypothesis was confirmed live, and a second
          independent cause was found. `lastStartedAt` is stamped at
          pod-record creation, 5-7 ms BEFORE `createdAt`, so the classifier
          short-circuited to engine:init on the first probe; separately, the
          `machine` object stays {} for the whole deploy while the top-level
          `machineId` populates immediately, so the host-assignment check
          never fired either. The working boundary is the `runtime` block on
          the v2 pod endpoint, which is null until the container runs. A 1.5B
          cold start now splits 109s image pull (72%) and 43s engine init
          (28%), cross-checked against ground truth derived independently
          from runtime.uptimeInSeconds. Design notes in
          docs/design/0005-engine-image-coldstart.md.
      - id: pin-is-provider-and-region-scoped
        notes: |
          A volume belongs to one provider and one datacenter. A deploy that
          lands elsewhere gets no benefit and silently falls back to cold.
      - id: cold-times-vary-with-hf-bandwidth
        notes: |
          Cold provision time scales with in-pod Hugging Face bandwidth (about
          30 MB/s on the flagship run) and varies run to run, so the 11x
          figure is one measurement rather than a constant.
      - id: single-card-only
        notes: |
          Everything here assumes one engine on one GPU. Weights that do not
          fit any single card, and a KV budget that does not scale at long
          context, both point at spreading one engine's KV domain across
          several cards, which is Chapter 10.

    patterns_introduced:
      - name: placement-vs-tuning
        notes: |
          Finding a card that fits a budget is control-plane work, because it
          is provider-matching. How a model splits a card it has already been
          given is engine work, because it is the engine's own arithmetic and
          changes release to release. The thin pass-through keeps the two
          release cycles independent.
      - name: measure-the-saving-dont-assert-it
        notes: |
          A cache that claims to help should carry the label that proves it.
          The storage_tier cut makes the warm-vs-cold difference a gap you can
          read off a dashboard rather than a number in a README.
      - name: fail-soft-on-a-missing-cache
        notes: |
          An absent or wrong pin degrades to the slow path instead of failing
          the deploy, so the optimization can never be the reason a deployment
          does not come up.

    metric_vocabulary:
      reliably_emitted:
        - name: iplane.deployment.provision.duration
          type: histogram
          source: internal/metrics (deploy observer)
          notes: End-to-end provision wall-clock, now additionally labeled storage_tier=cold|warm. The dashboard's top line.
        - name: iplane.deployment.phase.duration
          type: histogram
          source: internal/provisioners (deploy_telemetry)
          notes: Per-phase seconds, additionally labeled storage_tier. At this tag the phase split could not attribute the image pull; see the image-pull-phase-measures-zero limitation, which records both the state at the tag and its resolution in PR 210.

  - tag: ch08-final
    alias: v0.2.1
    chapter: 8
    chapter_title: Stateful Routing and Prefix-Cache Reuse
    branch: release/v0.2
    date: 2026-07-06

    summary: |
      Cache-aware routing. Chapter 7 fanned a deployment out to N replicas
      behind round-robin, which scatters a multi-turn conversation across
      engines and defeats the engine's prefix cache. This chapter adds a
      second routing policy, `prefix_affinity`, that keeps a conversation on
      the replica holding its prefix. The router gains real state (a
      session→replica pin map) predicted from its own routing history, never
      by querying the engine. Session identity rides a request-level hint
      (`X-IPlane-Session`) or, for header-less OpenAI-SDK clients, a key the
      router derives from the conversation's opening. A default-off load-aware
      override spills off a saturated pinned replica while keeping the pin.
      The whole arc runs GPU-free on `iplane mock-engine` behind the external
      (non-owning) provider; the prefix-cache hit-rate and latency figures come
      from a real multi-replica run. No proto changes, no engine changes: one
      new policy behind the Chapter 7 routing seam plus one request hint.

    capabilities:

      - name: Session-mode load driver
        status: shipped
        notes: |
          `iplane load session` — closed-loop, stateful, multi-turn driver.
          One goroutine per conversation holds history and loops
          build-turn → POST → append response → think-time, stamping each
          request with `X-IPlane-Session`. Closed-loop is what produces the
          long-lived overlapping sessions that make routing locality matter.
          Flags: `--sessions N`, `--turns M`, `--think-time`,
          `--system-prompt-tokens`, reusing `--target/--service-url/--model/
          --stream`. Conversation content is a deterministic synthetic
          generator; real-corpus (ShareGPT/LMSYS) replay is walkthrough-only.
        prs: [177]
        related_issues: [171]

      - name: PrefixAffinity routing policy
        status: shipped
        notes: |
          Second `internal/router/policy.Policy` impl behind the seam Chapter 7
          cut. `router.routing_policy: round_robin (default) | prefix_affinity`,
          toggled server-side on `iplane serve` (`--routing-policy`, config, or
          `IPLANE_ROUTER_ROUTING_POLICY`); unknown values fail fast at startup.
          Pins a session's turns to the replica that holds its prefix; a new
          session places round-robin then pins; a pin to a quarantined or
          scaled-away replica transparently re-pins. The router predicts
          residency from its own routing history (a pin map) — it never queries
          the engine, which keeps engine state off the hot path.
        prs: [178]
        related_issues: [172]

      - name: Header-less body-derived session key
        status: shipped
        notes: |
          A plain OpenAI SDK that sends no `X-IPlane-Session` still gets
          affinity. On the flat `/v1/chat/completions` URL (which already
          buffers the body to read `model`) the router derives a key from the
          conversation's opening — hash(first system message + first user
          message) — stable across a conversation's turns and distinct per
          conversation. Precedence: explicit header > derived key > none. The
          deploy-id URL streams the body unparsed and stays header-only.
          Opening-hash is coarse: two conversations sharing a system prompt get
          distinct keys; longest-shared-prefix co-location is a follow-up.
        prs: [186]
        related_issues: [181]

      - name: Load-aware affinity override
        status: shipped
        notes: |
          `router.affinity_overload_threshold` (0 = off, pure stickiness).
          When a session's pinned replica has >= threshold requests in flight,
          the turn spills to the coolest eligible replica but the pin is NOT
          moved — a temporary detour that snaps back when load subsides. If the
          pin is itself the coolest replica, no spill. Resolves the
          affinity-vs-fairness tension with Chapter 7's per-tenant fair-share.
          Reuses existing metrics: a spill registers as an affinity miss, so
          hit-rate dips under overload while per-replica in-flight stays
          bounded.
        prs: [185]
        related_issues: [174]

      - name: Affinity hit-rate metric
        status: shipped
        notes: |
          `iplane.router.affinity.total` (counter, labeled deploy_id /
          outcome=hit|miss) + v0.2 Grafana panel. For each request carrying a
          session key the router compares the chosen replica against where the
          session last landed. hit-rate = hit / (hit+miss): ~1/N under
          round-robin, ~1.0 under affinity — the chapter's money panel.
          Measured AT THE ROUTER from iplane's own routing decisions: a
          routing-locality PROXY for the engine's real
          `gpu_prefix_cache_hit_rate`, not the engine number itself. The two
          track each other except under KV eviction (the memory-pressure beat).
        prs: [184]
        related_issues: [173]

      - name: External provider + `iplane mock-engine`
        status: shipped
        notes: |
          A new provider category: the external (non-owning) provider.
          `iplane deployment deploy <id> --provider external --engine-endpoints
          http://a,http://b` registers a RUNNING deployment pointing at engines
          the operator runs themselves (one replica per URL) — no provisioning,
          no image, no model validation. Spawn fabricates from the endpoint
          (zero cost); Terminate detaches, never touching the operator's engine.
          `iplane mock-engine --port P --latency` serves the OpenAI surface over
          a mock backend, making the whole prefix-affinity walkthrough run
          GPU-free. External is the static precursor to Chapter 10
          self-registration and the degenerate case of the Chapter 11 HostedAPI
          provider.
        prs: [183]
        related_issues: [179]

      - name: Prefix-affinity walkthrough (examples/07)
        status: shipped
        notes: |
          `examples/07-prefix-affinity/run.sh` (or `make demo`) — a runnable,
          GPU-free three-act walkthrough on the mock engine. 07a round_robin:
          sessions scatter (9/9). 07b prefix_affinity: each session pins
          (scatter 0/9). 07c + `affinity_overload_threshold`: saturated replicas
          shed load, scatter climbs back (8/9). Measures ROUTING (a per-engine
          session distribution + scatter score), no obs stack needed. A
          "Capturing the book figures (real cluster)" checklist covers the paid
          run that produces the hit-rate / TTFT screenshots.
        prs: [188]
        related_issues: [175]

      - name: "Engine `gpu_prefix_cache_hit_rate` scrape (ground truth)"
        status: deferred
        moved_to: v0.3+
        notes: |
          The affinity hit-rate is a router-side proxy. The engine's own
          prefix-cache hit-rate is the ground truth and requires scraping the
          engine's `/metrics`, still deferred. Its divergence from the proxy
          under KV eviction is exactly the memory-pressure story.
        related_issues: [51]

      - name: Engine-signal-informed routing
        status: deferred
        moved_to: v0.3+
        notes: |
          Predicting residency from routing history is a floor, not a ceiling.
          Stronger prediction (fleet-wide radix tree + overlap score, à la
          NVIDIA Dynamo) or listening to engine KV-cache events (à la llm-d)
          would raise hit-rate at the cost of a fleet-wide cache index kept
          current. Tracked as a spike.
        related_issues: [189]

      - name: Demo fidelity — context pruning + asymmetric whale load
        status: deferred
        moved_to: v0.3+
        notes: |
          The closed-loop driver runs uniform sessions, so 07c shows
          saturation-spill rather than a true single-session whale, and
          front-pruning invalidating a cached prefix can't be reproduced. Both
          need driver features (per-session load weighting, context pruning)
          not yet built.
        related_issues: [187]

    cli_surface:
      # New at this tag (additive over ch07-final):
      - iplane load session --sessions --turns --think-time --system-prompt-tokens
      - iplane mock-engine --port --latency
      - iplane serve --routing-policy round_robin|prefix_affinity
      - iplane deployment deploy --provider external --engine-endpoints <url,url,...>

    environment_variables:
      recommended:
        - name: IPLANE_ROUTER_ROUTING_POLICY
          notes: "`round_robin` (default) | `prefix_affinity`. Equivalent to `--routing-policy` on `iplane serve`."
        - name: IPLANE_ROUTER_AFFINITY_OVERLOAD_THRESHOLD
          notes: "0 = off (pure stickiness) | N = spill when a pinned replica has >= N requests in flight."

    known_limitations:
      - id: affinity-hit-rate-is-a-proxy
        notes: |
          The router measures routing locality, not the engine's cache. The
          engine's real `gpu_prefix_cache_hit_rate` is deferred (issue 51).
      - id: kv-eviction-real-engine-only
        notes: |
          The cache ceiling (pinned sessions evicting each other) and
          front-pruning invalidation are real-engine phenomena; the mock has no
          cache to evict.
      - id: engine-is-one-opaque-kv-domain
        notes: |
          The router routes to engines, not GPUs. One engine's KV domain
          spanning multiple GPUs (tensor parallelism) is Chapter 10; KV memory
          budgets at model scale are Chapter 9.

    patterns_introduced:
      - name: routing-decisions-respect-cache-locality
        notes: |
          A stateless load balancer optimizes for even spread; once backends
          hold warm state, even spread is the wrong objective and the router
          becomes stateful to do better.
      - name: predict-dont-query
        notes: |
          The router predicts prefix residency from its own routing history
          rather than putting the engine's internal state on the hot path.
          Correctness depends on the routing being valid, not the prediction
          being right (a bad prediction costs one cold prefill).
      - name: design-ahead-of-need-when-visible
        notes: |
          Chapter 7's routing-policy seam was speculative until this chapter's
          second implementation paid it back. Named-future seams pay back;
          purely speculative ones just add complexity.

    metric_vocabulary:
      reliably_emitted:
        - name: iplane.router.affinity.total
          type: counter
          source: internal/router (PrefixAffinity)
          notes: Labeled deploy_id / outcome=hit|miss. Router-side affinity hit-rate, a proxy for the engine's gpu_prefix_cache_hit_rate.

  # ---------------------------------------------------------------------------
  # Backfill: ch07-final was tagged 2026-06-29 but no capabilities entry was
  # written at the time. Reconstructed from what shipped at the tag so the book
  # Ch 7 Capability Snapshot (currently a promissory placeholder) has a
  # canonical source and `make check-snapshots` can verify it.
  - tag: ch07-final
    alias: v0.2.0
    chapter: 7
    chapter_title: Routing, Queueing, and the Control Plane in the Data Path
    branch: release/v0.2
    date: 2026-06-29

    summary: |
      The control plane re-enters the inference data path. `iplane serve`
      becomes the long-lived daemon every request flows through: a router in
      front of the engine, a bounded queue for multi-tenant fairness, a
      scheduler that picks what runs next, and multi-replica fan-out. The
      operator points clients at one OpenAI-compatible iplane URL instead of
      the engine's proxy URL. Three beats — router (two URL shapes,
      request-level metrics, W3C trace propagation, idle-TTL reaper),
      queue+scheduler (per-tenant strict-priority + weighted-lottery fair-share
      from request headers), and multi-replica fan-out (one deployment ID over
      N instances, `iplane deployment scale`, per-replica health-checking,
      heterogeneous multi-cloud fleets). The routing-policy seam is cut here;
      prefix-cache affinity is Chapter 8.

    capabilities:

      - name: Data-plane router
        status: shipped
        notes: |
          `iplane serve` runs a thin reverse proxy in front of the engine. Two
          URL shapes: `/v1/<deploy-id>/v1/...` for unambiguous routing and flat
          `/v1/chat/completions` (body-peek `model`) for OpenAI-SDK compat.
          Request-level metrics tick here and populate the v0.2 Grafana
          dashboard. W3C TraceContext + Baggage propagate router → engine.
          Idle-TTL reaper + `TouchDeployment` RPC + `--no-idle-destroy` pin
          protect against leaked deployments. The CP/DP boundary is gRPC-only
          (enforced constraint).
        prs: [109, 127]
        docs: ["examples/04-router-in-path/"]
        related_issues: [107]

      - name: Queue and scheduler
        status: shipped
        notes: |
          A bounded waiting room in front of the router; `internal/scheduler/`
          hosts the dequeue-and-dispatch primitive. Tenant + priority resolve
          from request headers (`X-IPlane-Tenant`, `X-IPlane-Priority`):
          strict-priority across lanes, weighted-lottery fair-share within a
          lane. Per-deployment in-flight cap mirrors the engine's
          `max-num-seqs`. Priority is request-level only — engines stay
          priority-blind. Observability: queue-depth gauge + queue-wait
          histogram.
        prs: [128, 136]
        docs: ["examples/05-fair-queueing/"]

      - name: Multi-replica fan-out
        status: shipped
        notes: |
          One stable deployment ID over N backing instances (parallel
          instance_ids / engine_endpoints / unhealthy_instance_ids). `iplane
          deployment scale <id> N` is the capacity verb; `DEGRADED` is the
          first-class partial-provisioning outcome. The router fans out
          round-robin across the healthy replicas, composing with the unhealthy
          set so the data path is never told which replicas to skip.
        prs: [137, 140]
        docs: ["examples/06-multi-replica/"]

      - name: Per-replica health checker
        status: shipped
        notes: |
          A background poller probes each replica's `/health` on a cadence and
          auto-quarantines stuck replicas; recovered replicas rejoin the
          rotation. Reaction is passive on the data path — a quarantined
          replica just stops receiving new requests. Per-replica in-flight
          gauge + routing-decisions counter restore decision visibility.
        prs: [141, 142]

      - name: Request metric families
        status: shipped
        notes: |
          The four "metrics that matter" removed from the v0.1 dashboard come
          back now that the router emits them server-side: request rate,
          request latency histograms, completion-token throughput, and backend
          health. This closes the ch06 known-limitation
          `engine-metrics-not-in-dashboard` at the router layer; the engine's
          own `/metrics` scrape stays deferred (issue 51).
        related_issues: [51]

      - name: Routing-policy seam
        status: shipped
        notes: |
          Per-request replica selection goes through an interface
          (`internal/router/policy`); round-robin is the v0.2 default impl.
          Interface-only at this tag — the seam exists so Chapter 8's
          `PrefixAffinity` drops in as a second impl without a router refactor.
        prs: [148]

      - name: Multi-cloud provider catalog
        status: shipped
        notes: |
          Heterogeneous fleets via `ReplicaSpec.replicas` — one deployment can
          pull replicas from RunPod, Vast.ai, and Lambda Labs together, with the
          homogeneous case as the degenerate one-spec form. Vast.ai marketplace
          adapter, Lambda Labs fixed-catalog adapter (HTTP-Basic),
          `IPLANE_PROVIDER` env-driven default. Hardware spec + metadata on
          `Instance` exposes GPU SKU / VRAM / region without proto churn.
        prs: [152, 154, 156]
        related_issues: [18]

      - name: Prefix-cache affinity
        status: deferred
        moved_to: ch08-final
        notes: |
          The routing-policy seam is cut here; the cache-aware `prefix_affinity`
          policy that keeps a conversation on the replica holding its prefix
          ships in Chapter 8.

    cli_surface:
      # New at this tag (additive over ch06-final):
      - iplane serve --routing-policy round_robin
      - iplane deployment scale <id> N
      - iplane deployment touch
      - iplane load --target --priority --tenant --stream --output json
      # Request headers the router/queue read:
      - "X-IPlane-Tenant / X-IPlane-Priority (request-level)"

    environment_variables:
      recommended:
        - name: IPLANE_PROVIDER
          notes: Default provider when a ReplicaSpec omits one.

    known_limitations:
      - id: round-robin-defeats-prefix-cache
        notes: |
          Round-robin scatters a multi-turn conversation across replicas, so
          the engine's prefix cache collapses toward 1/N hit-rate. Chapter 8's
          prefix-affinity policy closes this.
      - id: engine-metrics-scrape-still-deferred
        notes: |
          Router-emitted request metrics are back, but the engine's own
          `/metrics` (e.g. gpu_prefix_cache_hit_rate) still isn't scraped
          (issue 51).

  - tag: ch06-final
    alias: v0.1.0
    chapter: 6
    chapter_title: Building the Control Plane (v0.1)
    branch: release/v0.1
    date: 2026-05-31

    summary: |
      Single-instance control plane. From an empty laptop with a RunPod
      API key, the operator runs `iplane up --model <hf-id>` and is
      chatting with the model on a remote GPU pod within minutes;
      Ctrl-C tears everything down. The five capability phases land:
      Provisioner subsystem (two providers + state-file hygiene),
      image-as-pod deploy (cost-aware proxy default, debug_shell opt-in),
      OTel endpoint propagation (hosted-OTLP OR cloudflared-tunneled
      local stack), ModelStore HF pre-flight validation, and the
      flagship `iplane up` one-liner. iplane is NOT in the inference
      data path in v0.1 — the operator's request goes laptop → engine
      proxy URL directly. The data-plane router is the first beat of
      chapter 7.

    capabilities:

      - name: Provisioner subsystem
        status: shipped
        notes: |
          `internal/provisioners/` Service + state-file store + RunPod
          adapter + local adapter. Failure-mode contract: idempotency
          on (operator, id), state-file under flock, PENDING → ACTIVE
          hygiene, list-with-self-heal, terminate idempotency. CLI:
          `iplane instance {create,list,describe,destroy,ssh,wait}`
          with `--service-url` remote transport or in-process default,
          `--output table|json`, `--dry-run` with cost preview.
        prs: [6, 7, 8, 9, 16]
        docs: ["docs/design/0001-provisioner.md", "examples/01-end-to-end/", "examples/02-cli-end-to-end/"]

      - name: Image-as-pod deploy primitive
        status: shipped
        notes: |
          `iplane deployment deploy --provider runpod --class small
          --image <engine-image> --model <hf-id>` auto-provisions a
          1:1 instance via the `placeDeployment` scheduler seam. The
          provider runs the engine image directly as the pod (no SSH,
          no docker-in-docker). Health is HTTP-polled on the provider's
          free HTTPS proxy URL. Cost-aware default: no publicIp, no
          SSH port — `Deployment.debug_shell: true` is the opt-in that
          flips both back on, named as provider-neutral operator
          intent each adapter translates differently. State-file
          hygiene: `provider_id` stamped onto the instance at
          emit-time so destroy reaches the provider even after a
          failed deploy. Streaming progress via `WatchDeployment` so
          the operator sees forward motion through the 5–10min cold
          image pull.
        prs: [44, 45]
        docs: ["docs/design/0002-deploy.md"]

      - name: "First served request — `iplane deployment query`"
        status: shipped
        notes: |
          Single-turn `POST /v1/chat/completions` to the engine's proxy
          URL directly. Demonstrates that inference traffic does NOT
          pass through the control plane — the verb dials engine_endpoint
          read from Describe. iplane stays out of the data path. Text
          mode prints assistant response on stdout + tokens+latency on
          stderr; JSON mode pretty-prints the raw engine body.
        prs: [46]

      - name: Telemetry seeding — OTel endpoint propagation
        status: shipped
        notes: |
          Two operator-pickable sinks both work via the same propagation
          mechanism: (a) hosted OTLP (Grafana Cloud Free, Honeycomb, etc.)
          — zero local infra; (b) local docker-compose stack
          (otel-collector + tempo + loki + mimir + grafana) exposed to
          remote pods via a cloudflared quick tunnel
          (`COMPOSE_PROFILES=tunnel`). Both reduce to "set
          OTEL_EXPORTER_OTLP_ENDPOINT on the pod"; iplane just
          propagates. New `iplane deployment deploy --otel-endpoint
          --otel-headers` flags with `IPLANE_OTEL_*` env fallbacks;
          new `iplane telemetry url` discovers the cloudflared tunnel
          URL. Demo 03's wire-telemetry step hard-fails on missing
          endpoint as a chapter teaching beat. Engine ships TRACES
          only — metrics live at `/metrics` Prometheus scrape, not
          OTLP (vLLM v0.7.x limitation; v0.2 work).
        prs: [49]
        docs: ["docs/telemetry.md"]

      - name: Honest observability dashboard
        status: shipped
        notes: |
          Two panels, intentionally. Markdown header explaining what
          v0.1 actually emits and why; provider rate catalog table
          rendering `gpu_effective_rate_usd_per_second × 3600` per row
          in `providers.yaml`. Earlier drafts had request-rate / latency-
          histogram / utilization / spend panels; they all queried iplane
          self-metrics that never tick after the image-as-pod pivot
          (iplane is out of the data path). Removed deliberately,
          documented honestly. Chapter teaches this as architectural
          truth-telling, same energy as `docs/design/0002-deploy.md`'s
          SUPERSEDED banner.
        prs: [52]
        related_issues: [51]

      - name: ModelStore pre-flight validation + HF impl
        status: shipped
        notes: |
          `Service.CreateDeployment` calls `ModelStore.Resolve(spec)`
          between proto validation and the placement seam. HF impl
          GETs `huggingface.co/api/models/<id>` with 5s timeout; maps
          HTTP status to actionable errors (404 → typo; 401/403 →
          gated; 5xx → `--skip-model-validation` bypass). Propagates
          `$HF_TOKEN` env from operator's shell into `Resolved.EnvOverrides`
          so the engine pod can pull gated weights. Pattern: "validation
          at the edge" — iplane catches what it can catch cheaply,
          leaves what only the engine can determine to the engine.
          Interface carries `Resolved.Mounts []Mount` field unused in
          v0.1 but sized for v0.2's `CachedStore` / `RunPodVolumeStore`
          to drop in without proto or Service-code changes ("build the
          seam now, fill it later").
        prs: [54]
        docs: ["docs/modelstore.md"]

      - name: "Flagship one-liner — `iplane up`"
        status: shipped
        notes: |
          `iplane up --model <hf-id>` provisions a GPU pod, runs the
          engine image-as-pod, waits for `/health`, drops the operator
          into a readline-backed chat REPL with arrow-key history, tears
          everything down on empty prompt OR Ctrl-C OR provision
          failure (deferred `DestroyDeployment` is the leak-protection
          invariant). ~360 lines of pure orchestration over existing
          primitives — `CreateDeployment{auto-provision, wait=true}` +
          `WatchDeployment` for cold-start progress + `POST /v1/chat/completions`
          direct to engine + `DestroyDeployment`. Zero new proto
          fields. `--no-chat` mode for "give me the endpoint and block
          on Ctrl-C"; `--debug-shell` forwards from the deploy verb.
          Single-instance / single-model in v0.1 (multi-replica is
          chapter 7; multi-model is v1.0).
        prs: [53]
        docs: ["docs/iplane-up.md"]

      - name: "`iplane instance ssh` one-step UX"
        status: shipped
        notes: |
          `syscall.Exec`-replaces iplane with `ssh` directly. Same PID;
          `ps` shows ssh only during session. Pass-through args land
          before destination so `iplane instance ssh my-pod -- -L
          8080:localhost:8000` works. Key materializes to `/run/user/$UID`
          tmpfs (Linux) or `os.TempDir()` (macOS); OS sweep is the
          cleanup mechanism. Path 1 of three options sketched in the
          issue; stronger residency (memfd, ssh-agent) deferred unless
          chapter audience needs it.
        prs: [55]

      - name: Data plane / inference router
        status: deferred
        moved_to: ch07-final
        notes: |
          Original v0.1 ROADMAP listed "Serve the OpenAI-compat API
          from `iplane serve`, proxying inference to the remote engine"
          as a v0.1 capability. After the image-as-pod pivot
          (PR 45) and during chapter-6 prose work, this work was
          reframed: a request router (OpenAI-compat HTTP server +
          path-based deployment lookup + request-metric instrumentation)
          is the first beat of chapter 7. v0.1 operators see the engine
          proxy URL directly; that's the gap the chapter 7 router closes.
          The "metrics that matter" panels (request rate, latency
          histograms, throughput) come back into the dashboard once
          the router emits them server-side.
        related_prs: [56]

      - name: "Engine `/metrics` scrape into the dashboard"
        status: deferred
        moved_to: v0.2
        notes: |
          vLLM v0.7.x's OTel wiring ships traces, not metrics. Engine
          metrics live at `/metrics` (Prometheus scrape format) on the
          engine pod. Reaching that from a remote pod needs an
          otel-collector `prometheusreceiver` scrape config that knows
          the per-deploy proxy URL — non-trivial discovery story.
          Three approaches sketched (static per-deploy config; iplane
          writes a file_sd discovery file; iplane proxies metrics
          itself). Defers to v0.2 alongside the router work.
        related_issues: [51]

      - name: Engine pod log tailing
        status: deferred
        moved_to: v0.2
        notes: |
          RunPod's REST API at rest.runpod.io/v1 has no logs endpoint;
          only the web UI surfaces them, or sshd inside the pod (which
          the cost-aware default deliberately doesn't allocate). The
          proposed v0.2 path SSHes in when `debug_shell: true` is set
          and tails `docker logs -f <container>`. Not blocking for
          chapter 6.
        related_issues: [47]

    providers_supported:
      - name: runpod
        status: full
        notes: |
          `Provider` + `Deployer` + `KeyRegistrar` + `SSHReadyWaiter`
          capabilities all implemented. REST API at rest.runpod.io/v1
          (image-native Deployer path). New scoped API key required
          (rpa_... prefix with REST scope). gpuTypeIds accepts a SET
          for cost-aware fallback when the cheapest SKU is saturated.
      - name: local
        status: zero-cost on-ramp
        notes: |
          `Provider` only (no Deployer — local instances have no engine
          endpoint). Useful for testing the failure-mode contract and
          exercising the CLI without any provider API key. No real
          deploy; the chapter uses this for the `instance` walkthrough.
      - name: lambda_labs
        status: deferred
        moved_to: v0.2
        notes: |
          v0.2 work; VM-style provider that uses the sshdocker.Executor
          fallback path. Same `Deployer` interface, different mechanics.
        related_issues: [18]

    cli_surface:
      - iplane instance {create,list,describe,destroy,ssh,wait}
      - iplane deployment {deploy,describe,destroy,list,query,wait,watch,models,status}
      - iplane telemetry {url}
      - iplane up
      - iplane serve
      - iplane load
      - iplane gen-names
      # Persistent root flags:
      - --config
      - --skip-model-validation

    environment_variables:
      required_for_runpod:
        - name: RUNPOD_API_KEY
          notes: Required for any RunPod operation. Must be a scoped key (rpa_... prefix) with REST scope.
      recommended:
        - name: IPLANE_OTEL_ENDPOINT
          notes: OTLP endpoint URL for engine traces. Either a hosted OTLP URL or `$(iplane telemetry url)` for the cloudflared tunnel.
        - name: IPLANE_OTEL_HEADERS
          notes: Comma-separated KEY=VALUE auth headers for the OTLP endpoint. Required for hosted providers; unused for unauthenticated tunnels.
      optional:
        - name: HF_TOKEN
          notes: Propagated to the engine pod for gated-model fetches. Pre-flight validation also uses it for gated-model existence checks.
        - name: IPLANE_SKIP_MODEL_VALIDATION
          notes: "Set to `1` to bypass the HF pre-flight check (offline / firewalled / self-hosted models)."
        - name: IPLANE_RUNPOD_DEBUG
          notes: "Set to `1` to log RunPod HTTP request/response bytes (sans Authorization) to stderr."
      future:
        - name: LAMBDA_API_KEY
          notes: Not used in v0.1.
        - name: VAST_API_KEY
          notes: Not used in v0.1.

    known_limitations:
      - id: single-instance-per-deploy
        notes: One GPU pod per deployment. Multi-replica + load balancing land in chapter 7 (queue + scheduler).
      - id: single-model-per-up
        notes: "`iplane up` provisions one model. Multi-model serving from one pod is v1.0 (lab mode)."
      - id: operator-sees-engine-url
        notes: |
          Without a data-plane router (chapter 7), the operator-facing
          URL is the engine's HTTPS proxy URL directly. Chapter 7 closes
          this gap by routing through an iplane-stable URL.
      - id: engine-metrics-not-in-dashboard
        notes: |
          Traces flow correctly; engine metrics live at the pod's
          `/metrics` endpoint and require Prometheus scraping that v0.1
          doesn't do (issue 51).
      - id: unix-only
        notes: |
          macOS + Linux supported. Windows not tested; `iplane instance
          ssh`'s `syscall.Exec` approach assumes Unix.
      - id: in-process-service-only
        notes: |
          `iplane serve` exists for backend traffic but doesn't yet
          host the provisioner Service over the wire — CLI verbs run
          in-process by default. `--service-url` mode forwards to a
          long-running iplane serve but is in-process for the
          provisioner side.

    patterns_introduced:
      - name: validation-at-the-edge
        notes: |
          Catch what you can cheaply, leave what only the next layer
          knows to that layer. ModelStore pre-flight (HF) is the v0.1
          example; v0.2 extends with image / GPU class / engine config
          validation.
      - name: build-the-seam-now-fill-it-later
        notes: |
          Define interfaces sized for future implementations so adding
          them doesn't require touching Service code. `Resolved.Mounts`
          (v0.2 caching) and `placeDeployment` (v1.0 bin-packing) are
          the v0.1 examples.
      - name: capability-discovery-at-runtime
        notes: |
          Provider impls satisfy optional Go interfaces
          (`Deployer`, `KeyRegistrar`, `SSHReadyWaiter`); Service
          interface-asserts at call sites to dispatch. Image-native vs
          VM-style providers share one `Provider` slot but differ in
          satisfied capabilities.
      - name: cost-aware-defaults
        notes: |
          v0.1's concrete instance is `debug_shell: false` (no publicIp,
          no SSH port allocated). Operators opt INTO the more
          expensive shape, not out of it. v0.2's `--replicas N` will
          extend this pattern (default 1, fan-out is opt-in).

    metric_vocabulary:
      # Set in stone at this tag; v0.2 may add but won't rename.
      reliably_emitted:
        - name: gpu_effective_rate_usd_per_second
          type: observable gauge
          source: providers.yaml + `internal/metrics/cost.go`
          notes: One observation per (provider, gpu_type, billing_mode) row in `providers.yaml`. The only iplane self-metric the dashboard queries in v0.1.
      removed_pending_v0.2:
        # These instruments are defined in `internal/metrics/` but
        # never increment in v0.1 because iplane is out of the data
        # path. They will tick again when chapter 7's router lands.
        - inference_requests_total
        - inference_request_duration_seconds_*
        - inference_tokens_generated
        - inference_active_seconds_total
        - inference_backend_healthy
        - instance_uptime_seconds_total
