# Reference deployment config for the v0.1 docker-compose stack.
#
# Most values can be left as-is; the env-var overrides defined in
# .env.local (see .env.local.example) are the right place to tweak
# per-instance details like the provider/gpu_type labels.

server:
  addr: ":8080"
  read_timeout_sec: 60
  write_timeout_sec: 600          # long enough for slow generations
  shutdown_sec: 30                # graceful drain budget

backend:
  # 'mock' is the default so 'make up' works on any host (Mac / no-GPU).
  # For real inference, switch to 'vllm' and bring the stack up with
  # `docker compose --profile gpu up -d` so the vllm service starts.
  engine: "mock"
  url: ""                          # ignored by mock; set for vllm
  name: "mock"                     # label value for metrics/logs

telemetry:
  # otlp_endpoint deliberately unset here so the source-of-truth is
  # the daemon's SetDefault (127.0.0.1:4317 -- works for host serve on
  # macOS Docker without DNS shenanigans). Mode A (compose) overrides
  # via IPLANE_TELEMETRY_OTLP_ENDPOINT=otel-collector:4317 in the
  # controlplane service block. Viper precedence: env > config-file >
  # default, so hardcoding here breaks Mode B silently.
  service_name: "inference-plane"
  environment: "dev"
  sample_ratio: 1.0               # sample 100% in dev; lower in prod

router:
  # v0.2 ch8 per-request replica selection:
  #   round_robin     (default) -- the Ch 7 load balancer; spreads turns
  #                   evenly, which defeats prefix caching on multi-turn
  #                   sessions.
  #   prefix_affinity -- Ch 8 sticky routing; pins a session's turns
  #                   (keyed on the X-IPlane-Session header) to the
  #                   replica that already holds its prefix.
  routing_policy: round_robin

  # v0.2 ch8 load-aware override (prefix_affinity only): when a session's
  # pinned replica has >= this many in-flight requests, spill that turn to
  # the coolest eligible replica, keeping the pin so the session returns
  # once its replica cools. 0 disables the override (pure stickiness);
  # the Ch 8 demo sets it low to show a whale session spilling.
  affinity_overload_threshold: 0

  # v0.2 Beat 2.4 scheduler in front of the engine. Strict-priority
  # dispatch: interactive lane preferred; batch only runs when
  # interactive is empty. Per-deployment in-flight cap mirrors the
  # engine's max-num-seqs.
  #
  # Three patterns:
  #
  # 1. Disabled (Beat 1 path): servicers = 0. Requests forward inline;
  #    no queue, no concurrency cap.
  # 2. Single global queue: set top-level servicers + capacity; both
  #    lanes inherit the same capacity.
  # 3. Per-lane tuning: set interactive.capacity / batch.capacity
  #    independently. Servicers is shared across lanes (the scheduler
  #    is one pool of workers servicing both queues).
  #
  # in_flight_cap > 0 caps concurrent in-flight per deployment; 0
  # means unlimited (only the worker count bounds engine load).
  queue:
    servicers: 0
    capacity: 256
    in_flight_cap: 0
    interactive:
      servicers: 0
      capacity: 256
    batch:
      servicers: 0
      capacity: 256
    # Per-tenant fair-share weights (v0.2 ch7-beat2.5). Within a
    # priority lane, each tenant has its own bounded sub-queue;
    # the scheduler picks one tenant per dispatch via weighted
    # random selection across non-empty tenants.
    #
    # Tenants not listed get weight 1. Higher weight = larger share
    # of dispatches under saturation. Restart-only in v0.2;
    # changes require an `iplane serve` restart.
    #
    # Example:
    #   tenant_weights:
    #     alice: 1
    #     bob: 3
    tenant_weights: {}

health:
  # v0.2 Beat 3.5 (#87): per-replica health-poll loop. One goroutine in
  # iplane serve probes GET <engine_endpoint>/health on each tick. After
  # `failure_threshold` consecutive failures, the replica is added to the
  # deployment's unhealthy_instance_ids set and the router (#85) skips
  # it. After `success_threshold` consecutive passes on a quarantined
  # replica, it is restored.
  #
  # Defaults give ~30s to first quarantine on a hung replica
  # (3 * 10s = 30s), matching the acceptance criterion in #87.
  # probe_timeout caps each probe; max_concurrent bounds in-flight probes
  # inside a tick so a daemon with many deployments doesn't fan out
  # uncontrolled.
  poll_interval: 10s
  failure_threshold: 3
  success_threshold: 3
  probe_timeout: 2s
  # activity_window vetoes a quarantine when the replica finished a request
  # this recently. A saturated engine can miss its 2s probe three ticks
  # running while still serving; quarantining it turns a slow deployment into
  # a failed one, because the router then 503s every request for want of a
  # healthy replica (#450).
  #
  # Sized for the slowest legitimate request, not for the probe cadence: at
  # 120k context one request takes minutes, so completions are sparse even on
  # a healthy engine. The cost is one-sided -- an engine that dies right after
  # completing something stays in service up to this much longer, while an
  # engine that never completed anything is unaffected.
  activity_window: 2m
  max_concurrent: 32

# model_cache (v0.2 Ch 9): warm model cache. When set, deployments mount
# a pre-staged volume and load weights off it instead of re-downloading
# from HuggingFace every deploy. Absent (the default) means the cold
# path: the engine downloads inside the pod. Provider-agnostic -- set
# volume_id for the image-native path (a RunPod network volume id) or
# host_path for the sshdocker bind path (a VM's mounted filesystem);
# either non-empty enables it. mount_path is where the engine reads
# from (defaults to /models). Populating the volume is a separate step;
# a miss degrades to a cold deploy, not a failure.
#
# model_cache:
#   volume_id: ""      # provider volume handle (image-native / RunPod)
#   host_path: ""      # host directory to bind (sshdocker / VM providers)
#   mount_path: /models
